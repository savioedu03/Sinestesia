<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sinestesia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="erro"></div>

<!-- TELA 1: colar texto -->
<div id="telaEntrada" class="tela">
  <div class="topo">
    <span class="titulo">Sinestesia</span>
    <button id="btnBancoEntrada" class="pequeno">Aa</button>
  </div>
  <textarea id="texto" placeholder="Cole o texto aqui..."></textarea>
  <div class="linha">
    <button id="btnColar">Colar da área de transferência</button>
    <button id="btnLer" class="forte">Começar a ler</button>
  </div>
</div>

<!-- TELA 2: leitor -->
<div id="telaLeitor" class="tela oculta">
  <div id="palco"><span id="palavra">...</span></div>
  <div id="marcar" class="oculta">
    <span>Marcar palavra:</span>
    <button class="cor azul" data-c="substantivo">Substantivo</button>
    <button class="cor vermelho" data-c="verbo">Verbo</button>
    <button class="cor dourado" data-c="adjetivo">Adjetivo</button>
    <button class="cor cinza" data-c="">Limpar</button>
  </div>
  <div id="status"></div>
  <div id="barra">
    <button id="btnVoltar">Voltar</button>
    <button id="btnBancoLeitor">Aa</button>
    <button id="btnAnt">&#9198;</button>
    <button id="btnPlay" class="forte">PLAY</button>
    <div id="velocidades"></div>
    <input id="velCustom" type="number" step="0.05" min="0.25" max="30" placeholder="x">
    <button id="btnVelOk">OK</button>
    <span id="contador">0/0</span>
  </div>
</div>

<!-- TELA 3: banco de palavras -->
<div id="telaBanco" class="tela oculta">
  <div class="topo">
    <button id="btnBancoVoltar">Voltar</button>
    <span class="titulo">Minhas palavras</span>
  </div>
  <div id="abas">
    <button class="aba azul" data-c="substantivo">Substantivos</button>
    <button class="aba vermelho" data-c="verbo">Verbos</button>
    <button class="aba dourado" data-c="adjetivo">Adjetivos</button>
  </div>
  <div class="linha">
    <input id="busca" placeholder="Buscar...">
    <input id="nova" placeholder="Nova palavra...">
    <button id="btnAdd" class="forte">Adicionar</button>
  </div>
  <div id="lista"></div>
  <div class="linha">
    <button id="btnExportar">Exportar</button>
    <button id="btnImportar">Importar</button>
  </div>
  <textarea id="io" placeholder="Exportar: o banco aparece aqui. Importar: cole aqui o texto salvo e toque em Importar."></textarea>
</div>

<script>
window.addEventListener('error', function (e) {
  mostrarErro('ERRO: ' + e.message + ' (linha ' + e.lineno + ')');
});
window.addEventListener('unhandledrejection', function (e) {
  mostrarErro('ERRO: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
function mostrarErro(t) {
  var d = document.getElementById('erro');
  d.style.display = 'block';
  d.textContent = t;
}
</script>
<script src="dicionario.js" onerror="mostrarErro('Nao achei dicionario.js')"></script>
<script src="app.js" onerror="mostrarErro('Nao achei app.js')"></script>
</body>
</html>
