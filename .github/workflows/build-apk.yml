name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Travar paisagem e liberar TTS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' $M
          sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' $M

      - name: Copiar codigo nativo
        run: |
          D=android/app/src/main/java/com/leitortts/app
          mkdir -p $D
          cp nativo/SintesePlugin.java $D/SintesePlugin.java
          cp nativo/MainActivity.java $D/MainActivity.java

      - name: Icone do app
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          rm -f $R/mipmap-*/ic_launcher*.webp
          for par in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${par%%:*}
            t=${par##*:}
            mkdir -p $R/mipmap-$d
            convert recursos/icone.png -resize ${t}x${t} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Sincronizar
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: leitor-tts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
