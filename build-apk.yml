name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Conferir arquivos
        run: |
          ERRO=0
          if [ ! -f nativo/SintesePlugin.java ] && [ ! -f SintesePlugin.java ]; then echo "::error::FALTA o arquivo SintesePlugin.java (suba na raiz do repositorio)"; ERRO=1; fi
          if [ ! -f nativo/MainActivity.java ] && [ ! -f MainActivity.java ]; then echo "::error::FALTA o arquivo MainActivity.java (suba na raiz do repositorio)"; ERRO=1; fi
          if [ ! -f recursos/icone.png ] && [ ! -f icone.png ]; then echo "::error::FALTA o arquivo icone.png (suba na raiz do repositorio)"; ERRO=1; fi
          for f in index.html app.js style.css dicionario.js; do
            if [ ! -f www/$f ]; then echo "::error::FALTA www/$f"; ERRO=1; fi
          done
          if ! grep -q "Sinestesia" www/index.html 2>/dev/null; then echo "::error::www/index.html ainda e a versao ANTIGA. Substitua pelo novo."; ERRO=1; fi
          if ! grep -q "Sintese" www/app.js 2>/dev/null; then echo "::error::www/app.js ainda e a versao ANTIGA. Substitua pelo novo."; ERRO=1; fi
          if ! grep -q "clipboard" package.json; then echo "::error::package.json ainda e a versao ANTIGA. Substitua pelo novo."; ERRO=1; fi
          if ! grep -q "Sinestesia" capacitor.config.json; then echo "::error::capacitor.config.json ainda e a versao ANTIGA. Substitua pelo novo."; ERRO=1; fi
          exit $ERRO

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Travar paisagem e liberar TTS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' $M
          sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' $M

      - name: Copiar codigo nativo
        run: |
          D=android/app/src/main/java/com/leitortts/app
          mkdir -p $D
          S=nativo
          if [ ! -f nativo/SintesePlugin.java ]; then S=.; fi
          cp $S/SintesePlugin.java $D/SintesePlugin.java
          cp $S/MainActivity.java $D/MainActivity.java

      - name: Icone do app
        run: |
          R=android/app/src/main/res
          I=recursos/icone.png
          if [ ! -f $I ]; then I=icone.png; fi
          rm -rf $R/mipmap-anydpi-v26
          rm -f $R/mipmap-*/ic_launcher*.webp
          for par in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${par%%:*}
            t=${par##*:}
            mkdir -p $R/mipmap-$d
            convert $I -resize ${t}x${t} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Sincronizar
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: leitor-tts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
